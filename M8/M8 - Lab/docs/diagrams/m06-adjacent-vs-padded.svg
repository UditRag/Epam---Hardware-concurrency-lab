<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400"><rect width="1000" height="400" fill="#ffffff"/><text x="40" y="42" font-family="Arial" font-size="26" font-weight="bold" fill="#172033">False sharing: adjacent vs padded counters</text><text x="40" y="90" font-family="Arial" font-size="20" fill="#172033">A. Adjacent slots — may share a cache line</text><rect x="40" y="112" width="420" height="92" rx="8" fill="#f5f7fb" stroke="#4b5563" stroke-width="2"/><rect x="50" y="124" width="195" height="66" rx="5" fill="#dbeafe" stroke="#2563eb"/><rect x="255" y="124" width="195" height="66" rx="5" fill="#ffedd5" stroke="#c2410c"/><text x="147" y="151" text-anchor="middle" font-family="Arial" font-size="16" fill="#172033">counter[0]</text><text x="147" y="174" text-anchor="middle" font-family="Arial" font-size="15" fill="#172033">Thread 0 writes</text><text x="352" y="151" text-anchor="middle" font-family="Arial" font-size="16" fill="#172033">counter[1]</text><text x="352" y="174" text-anchor="middle" font-family="Arial" font-size="15" fill="#172033">Thread 1 writes</text><text x="40" y="245" font-family="Arial" font-size="20" fill="#172033">B. Strided slots — 128-byte payload offset</text><rect x="40" y="268" width="195" height="66" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="137" y="294" text-anchor="middle" font-family="Arial" font-size="16" fill="#172033">index 0</text><text x="137" y="316" text-anchor="middle" font-family="Arial" font-size="15" fill="#172033">Thread 0</text><line x1="250" y1="301" x2="740" y2="301" stroke="#6b7280" stroke-width="2" stroke-dasharray="9 7"/><text x="495" y="286" text-anchor="middle" font-family="Arial" font-size="16" fill="#374151">16 × 8 bytes = 128 bytes</text><rect x="755" y="268" width="195" height="66" rx="5" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="852" y="294" text-anchor="middle" font-family="Arial" font-size="16" fill="#172033">index 16</text><text x="852" y="316" text-anchor="middle" font-family="Arial" font-size="15" fill="#172033">Thread 1</text><text x="40" y="370" font-family="Arial" font-size="14" fill="#4b5563">Illustrative layout only: exact cache-line size and array alignment depend on hardware/JVM.</text></svg>