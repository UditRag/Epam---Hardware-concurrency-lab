<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330"><rect width="1000" height="330" fill="#fff"/><text x="35" y="42" font-family="Arial" font-size="25" font-weight="bold" fill="#172033">Simplified cache-line ownership timeline</text><rect x="40" y="78" width="240" height="66" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="160" y="104" text-anchor="middle" font-family="Arial" font-size="16" fill="#172033">Core 0 writes</text><text x="160" y="126" text-anchor="middle" font-family="Arial" font-size="14" fill="#172033">counter[0], line L</text><path d="M285 111 H360" stroke="#4b5563" stroke-width="2"/><path d="M350 103 L362 111 L350 119" fill="none" stroke="#4b5563" stroke-width="2"/><rect x="370" y="78" width="240" height="66" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="490" y="104" text-anchor="middle" font-family="Arial" font-size="16" fill="#172033">Core 1 requests</text><text x="490" y="126" text-anchor="middle" font-family="Arial" font-size="14" fill="#172033">write ownership of L</text><path d="M615 111 H690" stroke="#4b5563" stroke-width="2"/><path d="M680 103 L692 111 L680 119" fill="none" stroke="#4b5563" stroke-width="2"/><rect x="700" y="78" width="260" height="66" rx="8" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/><text x="830" y="104" text-anchor="middle" font-family="Arial" font-size="16" fill="#172033">Core 0 writes again</text><text x="830" y="126" text-anchor="middle" font-family="Arial" font-size="14" fill="#172033">ownership may move back</text><path d="M830 150 V190 H160 V150" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="8 6"/><path d="M152 160 L160 148 L168 160" fill="none" stroke="#6b7280" stroke-width="2"/><text x="495" y="215" text-anchor="middle" font-family="Arial" font-size="17" fill="#374151">Repeated ownership transfers can create coherence traffic</text><text x="35" y="280" font-family="Arial" font-size="14" fill="#4b5563">Conceptual illustration only; not a hardware trace or proof of a specific MESI/MOESI transition.</text></svg>